name: Backup do Banco de Dados

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 00:00 Brasília (todo dia)
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar postgresql-client 17
        run: |
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Executar pg_dump
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}?sslmode=require" \
            --format=custom \
            --no-acl \
            --no-owner \
            -f "backup-$(date +%Y%m%d).dump"

      - name: Salvar artifact
        uses: actions/upload-artifact@v4
        with:
          name: "db-backup-${{ github.run_number }}"
          path: "backup-*.dump"
          retention-days: 30
