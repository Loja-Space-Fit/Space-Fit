name: Keep-alive Supabase

on:
  schedule:
    - cron: '0 12 */3 * *'  # 12:00 UTC a cada 3 dias
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Ping falhou com status $STATUS"
            exit 1
          fi

          echo "Supabase ativo."
